<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1120" viewBox="0 0 1600 1120" role="img" aria-labelledby="title desc">
  <title id="title">코스피 반도체 저점 분석 하네스 아키텍처</title>
  <desc id="desc">사용자 질문을 총괄 PM이 받아 리서치팀, 시나리오팀, 투자위원회, 자동 신뢰도 검증을 거쳐 최종 결과물로 만드는 과정을 보여주는 다이어그램</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f8fafc"/>
      <stop offset="1" stop-color="#eef2ff"/>
    </linearGradient>
    <linearGradient id="header" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#172554"/>
      <stop offset="1" stop-color="#312e81"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="7" stdDeviation="9" flood-color="#0f172a" flood-opacity="0.12"/>
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L10,5 L0,10 z" fill="#64748b"/>
    </marker>
    <style>
      text { font-family: "Noto Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif; }
      .stage { font-size: 17px; font-weight: 800; letter-spacing: .08em; }
      .card-title { font-size: 22px; font-weight: 800; fill: #0f172a; }
      .card-copy { font-size: 15px; font-weight: 500; fill: #475569; }
      .chip { font-size: 14px; font-weight: 700; fill: #334155; }
      .tiny { font-size: 13px; font-weight: 500; fill: #64748b; }
      .flow { fill: none; stroke: #64748b; stroke-width: 3; marker-end: url(#arrow); }
    </style>
  </defs>

  <rect width="1600" height="1120" fill="url(#bg)"/>
  <circle cx="1450" cy="120" r="180" fill="#c7d2fe" opacity=".23"/>
  <circle cx="100" cy="1030" r="210" fill="#bae6fd" opacity=".23"/>

  <!-- Header -->
  <rect x="0" y="0" width="1600" height="150" fill="url(#header)"/>
  <text x="800" y="58" text-anchor="middle" font-size="34" font-weight="900" fill="#ffffff">코스피 반도체 저점 분석 하네스</text>
  <text x="800" y="96" text-anchor="middle" font-size="18" font-weight="500" fill="#c7d2fe">18명의 AI 전문가가 조사 → 토론 → 검증 → 최종 심사를 나눠 수행하는 리서치 구조</text>
  <rect x="572" y="115" width="456" height="25" rx="12.5" fill="#ffffff" opacity=".12"/>
  <text x="800" y="133" text-anchor="middle" font-size="13" font-weight="700" fill="#e0e7ff">목표: 정답 예언이 아니라 확인된 사실 · 미확인 가정 · 판단 변경 조건 구분</text>

  <!-- User and PM -->
  <rect x="72" y="190" width="280" height="106" rx="20" fill="#ffffff" stroke="#cbd5e1" filter="url(#shadow)"/>
  <circle cx="120" cy="243" r="27" fill="#e0f2fe"/>
  <circle cx="120" cy="235" r="9" fill="#0284c7"/>
  <path d="M103 259c3-13 31-13 34 0" fill="#0284c7"/>
  <text x="160" y="231" class="card-title">사용자의 질문</text>
  <text x="160" y="259" class="card-copy">“지금이 정말 바닥인가?”</text>
  <text x="160" y="281" class="tiny">원자료 · 기준일 · 관심 범위 전달</text>

  <path d="M352 243 H430" class="flow"/>

  <rect x="450" y="180" width="700" height="126" rx="24" fill="#ffffff" stroke="#818cf8" stroke-width="2" filter="url(#shadow)"/>
  <rect x="450" y="180" width="17" height="126" rx="8" fill="#4f46e5"/>
  <circle cx="515" cy="243" r="34" fill="#eef2ff"/>
  <path d="M498 243h34M515 226v34" stroke="#4f46e5" stroke-width="5" stroke-linecap="round"/>
  <text x="570" y="222" font-size="15" font-weight="800" fill="#4f46e5">총괄 지휘자</text>
  <text x="570" y="252" class="card-title">PM · 오케스트레이터</text>
  <text x="570" y="280" class="card-copy">전문가 호출 순서 관리 · 결과 전달 · 충돌 조정 · 최종 정합성 확인</text>
  <rect x="953" y="211" width="154" height="30" rx="15" fill="#eef2ff"/>
  <text x="1030" y="231" text-anchor="middle" class="chip" fill="#4338ca">사용자 소통 창구</text>
  <rect x="953" y="251" width="154" height="30" rx="15" fill="#eef2ff"/>
  <text x="1030" y="271" text-anchor="middle" class="chip" fill="#4338ca">전체 흐름 통제</text>

  <path d="M1150 243 H1232" class="flow"/>
  <rect x="1252" y="190" width="276" height="106" rx="20" fill="#fff7ed" stroke="#fdba74" filter="url(#shadow)"/>
  <text x="1390" y="225" text-anchor="middle" font-size="14" font-weight="800" fill="#c2410c">명확한 경계</text>
  <text x="1390" y="252" text-anchor="middle" font-size="19" font-weight="900" fill="#7c2d12">투자 조언이 아님</text>
  <text x="1390" y="278" text-anchor="middle" class="tiny">매수·매도·포지션 크기 지시 없음</text>

  <!-- connector down -->
  <path d="M800 306 V352" class="flow"/>

  <!-- Wave 1 -->
  <rect x="72" y="370" width="1456" height="210" rx="26" fill="#ffffff" stroke="#7dd3fc" stroke-width="2" filter="url(#shadow)"/>
  <rect x="72" y="370" width="190" height="210" rx="26" fill="#e0f2fe"/>
  <rect x="245" y="370" width="17" height="210" fill="#e0f2fe"/>
  <text x="167" y="410" text-anchor="middle" class="stage" fill="#0369a1">WAVE 1</text>
  <text x="167" y="449" text-anchor="middle" font-size="25" font-weight="900" fill="#0c4a6e">리서치팀</text>
  <text x="167" y="478" text-anchor="middle" class="card-copy">확인된 사실 만들기</text>
  <rect x="113" y="506" width="108" height="34" rx="17" fill="#ffffff"/>
  <text x="167" y="529" text-anchor="middle" font-size="15" font-weight="800" fill="#0369a1">9명</text>

  <text x="296" y="407" font-size="14" font-weight="800" fill="#0284c7">8명의 분야별 조사자</text>
  <g>
    <rect x="290" y="425" width="138" height="48" rx="12" fill="#f0f9ff" stroke="#bae6fd"/><text x="359" y="455" text-anchor="middle" class="chip">반도체 산업</text>
    <rect x="440" y="425" width="138" height="48" rx="12" fill="#f0f9ff" stroke="#bae6fd"/><text x="509" y="455" text-anchor="middle" class="chip">거시경제</text>
    <rect x="590" y="425" width="138" height="48" rx="12" fill="#f0f9ff" stroke="#bae6fd"/><text x="659" y="455" text-anchor="middle" class="chip">지정학</text>
    <rect x="740" y="425" width="138" height="48" rx="12" fill="#f0f9ff" stroke="#bae6fd"/><text x="809" y="455" text-anchor="middle" class="chip">시장 수급</text>
    <rect x="290" y="485" width="138" height="48" rx="12" fill="#f0f9ff" stroke="#bae6fd"/><text x="359" y="515" text-anchor="middle" class="chip">투자심리</text>
    <rect x="440" y="485" width="138" height="48" rx="12" fill="#f0f9ff" stroke="#bae6fd"/><text x="509" y="515" text-anchor="middle" class="chip">과거 위기</text>
    <rect x="590" y="485" width="138" height="48" rx="12" fill="#f0f9ff" stroke="#bae6fd"/><text x="659" y="515" text-anchor="middle" class="chip">밸류에이션</text>
    <rect x="740" y="485" width="138" height="48" rx="12" fill="#f0f9ff" stroke="#bae6fd"/><text x="809" y="515" text-anchor="middle" class="chip">증거 큐레이션</text>
  </g>
  <path d="M900 479 H957" class="flow"/>
  <rect x="980" y="414" width="500" height="125" rx="18" fill="#f8fafc" stroke="#94a3b8"/>
  <text x="1010" y="445" font-size="14" font-weight="800" fill="#0369a1">리서치 팀장</text>
  <text x="1010" y="476" class="card-title">자료를 검수하고 하나로 종합</text>
  <text x="1010" y="504" class="card-copy">출처 · 숫자 충돌 · 독립 원자료 · 가정 혼입 확인</text>
  <text x="1010" y="526" class="tiny">결과: 증거 원장 + 리서치 종합본 + 미해결 질문</text>

  <path d="M800 580 V620" class="flow"/>

  <!-- Wave 2 -->
  <rect x="72" y="638" width="1456" height="222" rx="26" fill="#ffffff" stroke="#c4b5fd" stroke-width="2" filter="url(#shadow)"/>
  <rect x="72" y="638" width="190" height="222" rx="26" fill="#ede9fe"/>
  <rect x="245" y="638" width="17" height="222" fill="#ede9fe"/>
  <text x="167" y="680" text-anchor="middle" class="stage" fill="#6d28d9">WAVE 2</text>
  <text x="167" y="719" text-anchor="middle" font-size="25" font-weight="900" fill="#4c1d95">시나리오팀</text>
  <text x="167" y="748" text-anchor="middle" class="card-copy">가능한 미래 비교</text>
  <rect x="113" y="776" width="108" height="34" rx="17" fill="#ffffff"/>
  <text x="167" y="799" text-anchor="middle" font-size="15" font-weight="800" fill="#6d28d9">7명</text>

  <text x="295" y="677" font-size="14" font-weight="800" fill="#7c3aed">① 3개 시나리오를 동시에 구축</text>
  <rect x="290" y="696" width="190" height="72" rx="15" fill="#ecfdf5" stroke="#86efac"/>
  <text x="385" y="726" text-anchor="middle" font-size="18" font-weight="900" fill="#166534">좋은 흐름</text>
  <text x="385" y="751" text-anchor="middle" class="tiny">이익과 주문이 유지</text>
  <rect x="494" y="696" width="190" height="72" rx="15" fill="#fffbeb" stroke="#fde68a"/>
  <text x="589" y="726" text-anchor="middle" font-size="18" font-weight="900" fill="#92400e">보통 조정</text>
  <text x="589" y="751" text-anchor="middle" class="tiny">둔화되지만 확산 없음</text>
  <rect x="698" y="696" width="190" height="72" rx="15" fill="#fef2f2" stroke="#fecaca"/>
  <text x="793" y="726" text-anchor="middle" font-size="18" font-weight="900" fill="#991b1b">깊은 침체</text>
  <text x="793" y="751" text-anchor="middle" class="tiny">이익 감소가 전반 확산</text>

  <text x="295" y="805" font-size="14" font-weight="800" fill="#7c3aed">② 순서대로 검증</text>
  <rect x="290" y="817" width="180" height="30" rx="15" fill="#f5f3ff"/><text x="380" y="837" text-anchor="middle" class="chip">약점 공격</text>
  <path d="M470 832 H497" class="flow"/>
  <rect x="510" y="817" width="180" height="30" rx="15" fill="#f5f3ff"/><text x="600" y="837" text-anchor="middle" class="chip">숫자 재검산</text>
  <path d="M690 832 H717" class="flow"/>
  <rect x="730" y="817" width="180" height="30" rx="15" fill="#f5f3ff"/><text x="820" y="837" text-anchor="middle" class="chip">편향 점검</text>

  <path d="M930 749 H972" class="flow"/>
  <rect x="994" y="687" width="486" height="126" rx="18" fill="#fafafa" stroke="#a78bfa"/>
  <text x="1024" y="718" font-size="14" font-weight="800" fill="#6d28d9">시나리오 팀장</text>
  <text x="1024" y="749" class="card-title">하나의 결론으로 몰지 않음</text>
  <text x="1024" y="777" class="card-copy">근거 · 반박 · 확인 조건을 같은 형식으로 병렬 정리</text>
  <text x="1024" y="799" class="tiny">결과: 시나리오 종합본 + 앞으로 볼 사건 달력</text>

  <path d="M800 860 V900" class="flow"/>

  <!-- Wave 3 + gate + output -->
  <rect x="72" y="918" width="740" height="150" rx="24" fill="#ffffff" stroke="#fbbf24" stroke-width="2" filter="url(#shadow)"/>
  <rect x="72" y="918" width="170" height="150" rx="24" fill="#fef3c7"/>
  <rect x="225" y="918" width="17" height="150" fill="#fef3c7"/>
  <text x="157" y="954" text-anchor="middle" class="stage" fill="#b45309">WAVE 3</text>
  <text x="157" y="988" text-anchor="middle" font-size="22" font-weight="900" fill="#78350f">투자위원회</text>
  <rect x="103" y="1014" width="108" height="32" rx="16" fill="#ffffff"/>
  <text x="157" y="1036" text-anchor="middle" font-size="15" font-weight="800" fill="#b45309">2명</text>

  <rect x="275" y="946" width="205" height="94" rx="16" fill="#fffbeb" stroke="#fde68a"/>
  <text x="377" y="976" text-anchor="middle" font-size="18" font-weight="900" fill="#92400e">리스크 관리자</text>
  <text x="377" y="1003" text-anchor="middle" class="tiny">집중도 · 복합 악재</text>
  <text x="377" y="1025" text-anchor="middle" class="tiny">증거 취약성 점검</text>
  <path d="M480 993 H511" class="flow"/>
  <rect x="526" y="946" width="246" height="94" rx="16" fill="#fffbeb" stroke="#fde68a"/>
  <text x="649" y="976" text-anchor="middle" font-size="18" font-weight="900" fill="#92400e">투자위원회 의장</text>
  <text x="649" y="1003" text-anchor="middle" class="tiny">논리·근거 품질 최종 심사</text>
  <text x="649" y="1025" text-anchor="middle" class="tiny">통과 / 추가 확인 / 재검토</text>

  <path d="M812 993 H850" class="flow"/>
  <rect x="872" y="918" width="300" height="150" rx="24" fill="#ecfeff" stroke="#22d3ee" stroke-width="2" filter="url(#shadow)"/>
  <circle cx="922" cy="972" r="25" fill="#cffafe"/>
  <path d="M910 972l8 8 17-20" fill="none" stroke="#0891b2" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="962" y="958" font-size="14" font-weight="800" fill="#0e7490">필수 관문</text>
  <text x="962" y="986" font-size="20" font-weight="900" fill="#164e63">자동 신뢰도 검증</text>
  <text x="902" y="1020" class="tiny">원자료 해시 · 날짜 · 산식 · 필수 고지</text>
  <text x="902" y="1043" class="tiny">실패하면 결과물 생성 단계로 진행 금지</text>

  <path d="M1172 993 H1207" class="flow"/>
  <rect x="1228" y="918" width="300" height="150" rx="24" fill="#ecfdf5" stroke="#34d399" stroke-width="2" filter="url(#shadow)"/>
  <text x="1378" y="950" text-anchor="middle" font-size="14" font-weight="800" fill="#047857">최종 결과물</text>
  <rect x="1260" y="967" width="236" height="28" rx="14" fill="#ffffff"/>
  <text x="1378" y="986" text-anchor="middle" class="chip">리포트형 대시보드</text>
  <rect x="1260" y="1002" width="236" height="28" rx="14" fill="#ffffff"/>
  <text x="1378" y="1021" text-anchor="middle" class="chip">쉬운 서술형 리서치 노트</text>
  <rect x="1260" y="1037" width="236" height="28" rx="14" fill="#ffffff"/>
  <text x="1378" y="1056" text-anchor="middle" class="chip">미확인 자료·가정 목록</text>

  <text x="800" y="1100" text-anchor="middle" font-size="13" font-weight="600" fill="#64748b">정적 스냅샷 분석 · 자동 갱신 없음 · 최종 투자 판단은 사용자에게 있음</text>
</svg>
